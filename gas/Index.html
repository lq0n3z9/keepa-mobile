<!DOCTYPE html><html><head><base target="_top"><style>
body{font-family:-apple-system,sans-serif;margin:0;background:#f4f4f6}
header{position:sticky;top:0;background:#fff;padding:10px;box-shadow:0 1px 3px #0002;display:flex;gap:6px;flex-wrap:wrap}
input,select{font-size:16px;padding:6px;flex:1;min-width:120px}
.card{background:#fff;margin:8px;padding:10px;border-radius:10px;box-shadow:0 1px 2px #0001}
.t{font-weight:600;font-size:14px;margin-bottom:4px}.m{font-size:13px;color:#444}
.a{display:flex;gap:10px;margin-top:6px;align-items:center}.a a{font-size:13px}
button{margin-left:auto;background:#e33;color:#fff;border:0;border-radius:6px;padding:6px 12px;font-size:14px}
#n{flex:1;font-size:12px;color:#666;align-self:center}
.tg{display:flex;align-items:center;gap:6px;font-size:13px;color:#444;white-space:nowrap}.tg input{flex:none;min-width:0;width:20px;height:20px}
.row{display:flex;gap:10px;align-items:flex-start}.th{flex:0 0 64px;width:64px;height:64px;object-fit:contain;border-radius:6px;background:#f5f5f5}
.b{flex:1;min-width:0}.t{overflow-wrap:anywhere}
.g{display:block;width:100%;height:auto;aspect-ratio:3/1;object-fit:contain;margin-top:8px;border:1px solid #eee;border-radius:6px;background:#fafbfc}
.nog .g{display:none}
</style></head><body>
<header><input id="q" placeholder="検索（商品名・ASIN）"><select id="s">
<option value="addedAt">追加が新しい順</option><option value="profit">差額(価格-損益分岐)が大きい順</option>
<option value="price">価格が高い順</option><option value="rank">順位が良い順</option></select><div id="n"></div><label class="tg"><input type="checkbox" id="gt"> グラフ表示</label></header>
<div id="list">読み込み中…</div>
<script>
const KEY=<?= key ?>;let items=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=i=>i.image||('https://images-na.ssl-images-amazon.com/images/P/'+encodeURIComponent(i.asin)+'.09.MZZZZZZZ.jpg');
const gph=a=>'https://graph.keepa.com/pricehistory.png?asin='+encodeURIComponent(a)+'&domain=5&salesrank=1&amazon=1&new=1&bb=1&fba=1&fbm=1&range=90&width=600&height=200';
const GK='kfmLaterGraph';let showG=localStorage.getItem(GK)!=='off';
const rk=r=>parseInt(String(r).replace(/[^0-9]/g,''))||1e9, yen=n=>n===''?'-':'¥'+Number(n).toLocaleString();
function render(){const q=document.getElementById('q').value.toLowerCase(),s=document.getElementById('s').value;
 let v=items.filter(i=>(i.title+' '+i.asin).toLowerCase().includes(q));
 v.sort({addedAt:(a,b)=>String(b.addedAt).localeCompare(a.addedAt),profit:(a,b)=>(b.price-b.breakEven)-(a.price-a.breakEven),
  price:(a,b)=>b.price-a.price,rank:(a,b)=>rk(a.rank)-rk(b.rank)}[s]);
 document.getElementById('n').textContent=v.length+' / '+items.length+' 件';
 document.getElementById('list').innerHTML=v.map(i=>`<div class="card"><div class="row"><img class="th" loading="lazy" referrerpolicy="no-referrer" alt="" src="${esc(img(i))}" onerror="this.onerror=null;this.removeAttribute('src');this.style.visibility='hidden'"><div class="b"><div class="t">${esc(i.title)}</div>
 <div class="m">${esc(i.asin)}｜価格 ${yen(i.price)}｜損益分岐 ${yen(i.breakEven)}｜月販 ${esc(String(i.monthlySold).split('(')[0])}｜${esc(i.rank)}</div>
 <div class="a"><a href="${esc(i.keepaUrl)}">Keepa</a><a href="${esc(i.amazonUrl)}">Amazon</a>
 <button onclick="del('${esc(i.asin)}')">削除</button></div></div></div>
 <img class="g" loading="lazy" referrerpolicy="no-referrer" alt="価格履歴" src="${esc(gph(i.asin))}" onerror="this.remove()"></div>`).join('')||'<p style="padding:10px">該当なし</p>';}
function del(a){if(!confirm(a+' を削除しますか？'))return;
 google.script.run.withSuccessHandler(()=>{items=items.filter(i=>i.asin!==a);render();}).withFailureHandler(e=>alert(e.message)).apiDelete(KEY,a);}
const gt=document.getElementById('gt');gt.checked=showG;document.body.classList.toggle('nog',!showG);
gt.onchange=()=>{showG=gt.checked;localStorage.setItem(GK,showG?'on':'off');document.body.classList.toggle('nog',!showG);};
document.getElementById('q').oninput=render;document.getElementById('s').onchange=render;
google.script.run.withSuccessHandler(r=>{items=r;render();}).withFailureHandler(e=>document.getElementById('list').textContent=e.message).apiList(KEY);
</script></body></html>
